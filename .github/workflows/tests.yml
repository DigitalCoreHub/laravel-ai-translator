name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        dependency-version: [prefer-stable]
        include:
          # En düşük desteklenen sürümlerle de bir tur atıyoruz; composer.json'daki
          # alt sınırların gerçekten çalıştığından emin olmak için.
          - php: '8.3'
            laravel: '12.*'
            dependency-version: prefer-lowest

    steps:
      - uses: actions/checkout@v7

      - name: PHP kurulumu
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Composer önbelleği
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.dependency-version }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Laravel sürümünü sabitle
        run: |
          composer require --no-update --no-interaction \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/filesystem:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}"

      - name: Bağımlılıkları kur
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Testler
        run: vendor/bin/pest --colors=always

  quality:
    name: Kod kalitesi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # Kütüphanede composer.lock commit edilmiyor; install yerine update kullanıyoruz ki
      # bağımlılıklar her koşuda bu PHP sürümüne göre çözülsün.
      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Kod biçimi (Pint)
        run: vendor/bin/pint --test

      - name: Statik analiz (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
